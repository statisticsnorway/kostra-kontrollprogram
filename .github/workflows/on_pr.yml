name: Build and deploy PR

on:
  pull_request:

jobs:
  detect-changes:
    if: ${{ github.event.pull_request.user.login != 'dependabot[bot]' }}
    name:  Detect changes
    runs-on: ubuntu-latest
    outputs:
      needs_deploy: ${{ steps.filter.outputs.code_changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            code_changed:
              - 'altinn-api/**'
              - 'konsoll/**'
              - 'kontroller/**'
              - 'web/**'
              - 'web-frontend/**'

  build:
    needs: detect-changes
    if: ${{ needs.changes.outputs.needs_deploy == 'true' }}
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository at PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up PR caching for Gradle and Maven
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.m2/repository
          key: gradle-pr-${{ github.event.pull_request.number }}-${{ hashFiles('**/*.gradle*', '**/gradle/libs.versions.toml', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-pr-${{ github.event.pull_request.number }}-
            gradle-main-

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          token_format: access_token
          workload_identity_provider: "projects/${{ secrets.GAR_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/gh-actions/providers/gh-actions"
          service_account: "gh-actions-dftjen@${{ secrets.GAR_PROJECT_ID }}.iam.gserviceaccount.com"

      - name: Login to Artifact Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550
        with:
          registry: europe-north1-docker.pkg.dev/${{ secrets.NAIS_MANAGEMENT_PROJECT_ID }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Build with Gradle
        run: ./gradlew build --configuration-cache --parallel --build-cache --warn

      - name: Kostra Kontrollprogram Web - Build Docker image
        id: docker-build-web
        uses: nais/docker-build-push@ceabe305c64640175f133b7e59af6666b0a3c46c
        with:
          team: dftjen
          docker_context: ./web
          pull: false
          image_suffix: "web"
          tag: |
            dev-${{ github.sha }}
            dev-latest

      - name: Kostra Kontrollprogram Web - Deploy to Dev
        uses: nais/deploy/actions/deploy@6a9dcd6df697ec2d38edc78cadb0b9acd1232f50
        env:
          CLUSTER: test
          RESOURCE: .nais/web-dev.yaml
          NAMESPACE: dftjen
          WORKLOAD_IMAGE: ${{ steps.docker-build-web.outputs.image }}
          TELEMETRY: ${{ steps.docker-build-web.outputs.telemetry }}
          DEPLOY_SERVER: deploy.ssb.cloud.nais.io:443

      - name: Kostra Kontrollprogram Altinn API - Build Docker image
        id: docker-build-altinn-api
        uses: nais/docker-build-push@ceabe305c64640175f133b7e59af6666b0a3c46c
        with:
          team: dftjen
          docker_context: ./altinn-api
          pull: false
          image_suffix: "altinn-api"
          tag: |
            dev-${{ github.sha }}
            dev-latest

      - name: Kostra Kontrollprogram Altinn API - Deploy to Dev
        uses: nais/deploy/actions/deploy@6a9dcd6df697ec2d38edc78cadb0b9acd1232f50
        env:
          CLUSTER: test
          RESOURCE: .nais/altinn-api-dev.yaml
          NAMESPACE: dftjen
          WORKLOAD_IMAGE: ${{ steps.docker-build-altinn-api.outputs.image }}
          TELEMETRY: ${{ steps.docker-build-altinn-api.outputs.telemetry }}
          DEPLOY_SERVER: deploy.ssb.cloud.nais.io:443


      - name: Deployment Summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **SHA**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **URL**: [View Kostra Kontrollprogram](https://dev-kostra-kontrollprogram.intern.test.ssb.no)" >> $GITHUB_STEP_SUMMARY
          echo "- **URL**: [View Altinn API](https://dev-kostra-altinn-api.intern.test.ssb.no)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
