name: Run checks

on:
  push:
    branches:
      - master

  pull_request:

jobs:
  build:
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/build-template.yml
    secrets:
      GAR_PROJECT_NUMBER: ${{ secrets.GAR_PROJECT_NUMBER }}
      GAR_PROJECT_ID: ${{ secrets.GAR_PROJECT_ID }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    with:
      gradle-targets: build